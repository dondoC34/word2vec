[project]
name = "word2vec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pyarrow>=22.0.0",
    "regex>=2025.11.3",
    "scikit-learn>=1.9.1",
    "torch>=2.5.1",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.1.6",
]

[project.scripts]
w2v = "w2v.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["w2v"]
